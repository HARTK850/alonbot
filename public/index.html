<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עלון בוט - החיפוש החכם לעלוני שבת</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2><i class="fas fa-key"></i> הגדרות מפתח API</h2>
            <p>עלון בוט זקוק למפתח Gemini API כדי לפענח את הבקשות שלך.<br>המפתח נשמר <strong>בדפדפן בלבד</strong>!</p>
            <div class="api-key-input-group">
                <input type="password" id="apiKeyInput" placeholder="הדבק כאן את ה-API Key שלך">
                <button id="togglePasswordBtn"><i class="fas fa-eye"></i></button>
            </div>
            <p class="help-text">המודל בשימוש: <code>gemini-3.1-flash-lite</code></p>
            <button id="saveApiKeyBtn" class="primary-btn full-width"><i class="fas fa-save"></i> שמור מפתח</button>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div class="layout-wrapper">
        <div class="glass-container main-panel">
            <header class="bot-header">
                <button id="openSettingsBtn" class="icon-btn settings-btn" title="הגדרות"><i class="fas fa-cog"></i></button>
                <div class="bot-avatar"><i class="fas fa-robot"></i><div class="pulse-ring"></div></div>
                <h1>עלון בוט</h1>
                <p class="subtitle">העוזר האישי החכם למציאת עלוני שבת</p>
            </header>

            <main class="main-content">
                <div class="search-wrapper">
                    <div class="input-group">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="botInput" placeholder='נסה: "קולדצקי", "עלון לילדים", "פניני הלכה משבוע שעבר"' autocomplete="off" onkeydown="if(event.key==='Enter') doSearch()">
                        <button id="actionBtn" class="primary-btn" onclick="doSearch()"><span>חפש</span> <i class="fas fa-magic"></i></button>
                    </div>
                    <div class="popular-tags">
                        <span class="tag" onclick="setInput('זרע שמשון')">זרע שמשון</span> 
                        <span class="tag" onclick="setInput('קולדצקי')">קולדצקי</span>
                        <span class="tag" onclick="setInput('עלון מעניין לילדים')">עלון לילדים</span> 
                        <span class="tag" onclick="setInput('שבת בשבתו')">שבת בשבתו</span>
                    </div>
                </div>

                <div id="botStatusArea" class="status-box hidden">
                    <div class="status-content">
                        <div id="loadingSpinner" class="spinner hidden">
                            <div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div>
                        </div>
                        <div id="botIcon" class="status-icon"><i class="fas fa-info-circle"></i></div>
                        <p id="botMessage">מוכן לפעולה...</p>
                    </div>
                    
                    <!-- אזור ההורדות החלופיות (אם העלון הרגיל לא נמצא) -->
                    <div id="fallbackArea" class="hidden" style="margin-top: 15px;">
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">אופציות זמינות להורדה:</p>
                        <div id="fallbackButtons" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
                            <!-- יתווספו כאן דינמית מהשרת -->
                        </div>
                    </div>
                    
                    <div id="progressTrack" class="progress-track hidden">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                </div>
            </main>
        </div>

        <div class="glass-container history-panel">
            <h3><i class="fas fa-history"></i> היסטוריית הורדות</h3>
            <div id="historyList" class="history-list"></div>
            <button id="clearHistoryBtn" class="clear-btn hidden" onclick="clearHist()"><i class="fas fa-trash"></i> נקה היסטוריה</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
