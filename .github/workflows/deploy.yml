name: Deploy Static Content
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# מבטיח שרק פריסה אחת תרוץ בכל פעם
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/setup-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # וודא שהנתיב כאן תואם לתיקייה שבה נמצא ה-index.html שלך
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
